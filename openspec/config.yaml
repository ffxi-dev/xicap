schema: spec-driven

context: |
  xicap is Vault's capture format and its C++20 library; the Python, JavaScript, and Go bindings wrap the library.
  Mogsafe (ffxi-dev/mogsafe) keeps every uploaded capture in R2 for good, so a released format is a long-term contract.
  Until the owner declares production, the format may break compatibility; after that, readers keep reading every released version.
  C++ builds on Windows need an MSVC developer shell; the Go binding builds only on Linux; the JavaScript binding builds to Wasm with Emscripten.

rules:
  design:
    - Record implementation deviations under Implementation Notes with the reason and revisit trigger
  tasks:
    - Check a task only when implemented and verified by a test or recorded run
