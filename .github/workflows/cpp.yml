name: C++

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Memoria, an Ashita plugin, links xicap into a 32-bit DLL, so Windows builds both widths.
  build-and-test:
    uses: ffxi-dev/vault/.github/workflows/cmake.yml@ci/v1.14
    with:
      windows: '["x64", "x86"]'
      configure-args: -DXICAP_BUILD_TESTS=ON
      targets: xicap_tests make_vectors
