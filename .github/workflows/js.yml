name: JavaScript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.7"
      - working-directory: js
        run: npm ci && npm run build && npm test
