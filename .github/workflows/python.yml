name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [[self-hosted, lsb], windows-latest]  # lsb is the org runner; macOS bills private minutes at ten times Linux
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build fixture
        run: |
          cmake -S . -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release -DXICAP_BUILD_TOOLS=OFF -DXICAP_BUILD_FIXTURE_TOOL=ON
          cmake --build build-fixture --target xicap_make_fixture
        shell: bash

      - name: Generate fixture
        run: |
          mkdir -p js/test/fixtures
          ./build-fixture/xicap_make_fixture js/test/fixtures/sample.xicap
        shell: bash

      - name: Install package + tests
        run: pip install ./python[test]

      - name: Run pytest
        run: pytest python/tests -v

  spec-reader:
    # A reader written from FORMAT.md alone must read the conformance set as recorded.
    runs-on: [self-hosted, lsb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install zstandard==0.25.0 cryptography==50.0.0
      - run: python tests/spec_reader.py tests/vectors
      - run: python tests/spec_reader.py --example FORMAT.md
