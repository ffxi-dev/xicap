name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Self-hosted runners keep a home directory; packages there must not leak into the job.
env:
  PYTHONNOUSERSITE: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: [self-hosted, lsb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build fixture
        run: |
          cmake -S . -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release -DXICAP_BUILD_TOOLS=OFF -DXICAP_BUILD_FIXTURE_TOOL=ON
          cmake --build build-fixture --target xicap_make_fixture
        shell: bash

      - name: Generate fixture
        run: |
          mkdir -p js/test/fixtures
          ./build-fixture/xicap_make_fixture js/test/fixtures/sample.xicap
        shell: bash

      - name: Install package + tests
        run: pip install ./python[test]

      - name: Run pytest
        run: python -m pytest python/tests -v

  spec-reader:
    # A reader written from FORMAT.md alone must read the conformance set as recorded.
    runs-on: [self-hosted, lsb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install zstandard==0.25.0 cryptography==50.0.0
      - run: python tests/spec_reader.py tests/vectors
      - run: python tests/spec_reader.py --example FORMAT-3.md
