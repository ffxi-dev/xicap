name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Go caches a cgo package by its own folder's files, and the binding includes C++ from outside it.
          cache: false
      - run: dpkg -s libzstd-dev >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev; }
      - run: go vet ./...
      - run: go test ./...
