name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  # The whole CI on the tagged commit, so a tag publishes only what every binding passed on.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  js:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: "7.0.1"
      # The package takes its version from the tag; a tag that doesn't match CMakeLists.txt is a mistake, so it stops here.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "project(xicap VERSION $v " CMakeLists.txt || { echo "CMakeLists.txt is not at $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - working-directory: bindings/js
        run: |
          npm ci && npm run build && npm test
          npm version --no-git-tag-version "$VERSION"
          cp ../../LICENSE .
          npm pack
      - working-directory: bindings/js
        run: npm publish "ffxi-dev-xicap-$VERSION.tgz" --access public
      # What the release is, for people and for other bricks' checks: the format it writes, every package's name, and
      # the commit the ci job above tested (vault cross-repo-contracts, task 4.1). scripts/manifest.sh writes it.
      - run: scripts/manifest.sh "$VERSION" > manifest.json
      - run: gh release create "$GITHUB_REF_NAME" "bindings/js/ffxi-dev-xicap-$VERSION.tgz" manifest.json --notes "$(jq -r .summary manifest.json)" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
