name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: "6.0.13"
      # The package takes its version from the tag; a tag that doesn't match CMakeLists.txt is a mistake, so it stops here.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "project(xicap VERSION $v " CMakeLists.txt || { echo "CMakeLists.txt is not at $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - working-directory: bindings/js
        run: |
          npm ci && npm run build && npm test
          npm version --no-git-tag-version "$VERSION"
          cp ../../LICENSE .
          npm pack
      - working-directory: bindings/js
        run: npm publish "ffxi-dev-xicap-$VERSION.tgz" --access public
      - run: gh release create "$GITHUB_REF_NAME" "bindings/js/ffxi-dev-xicap-$VERSION.tgz" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
